<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>🧠 Nasibeh myAi</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <main class="app">

        <header class="app-header">

            <div>
                <h1>ذهنک من</h1>
                <p>Nasibeh myAi</p>
            </div>
        </header>

        <section class="sections">
            
            <button class="section-card">
                <span>👤</span>
                <strong>اطلاعات من</strong>
            </button>

            <button class="section-card">
                <span>🐶</span>
                <strong>اودی</strong>
            </button>

            <button class="section-card">
                <span>💻</span>
                <strong>برنامه‌نویسی</strong>
            </button>

            <button class="section-card">
                <span>🍳</span>
                <strong>آشپزی</strong>
            </button>

            <button class="section-card">
                <span>🦜</span>
                <strong>عروس هلندی</strong>
            </button>

            <button class="section-card">
                <span>🎂</span>
                <strong>کیک</strong>
            </button>

            <button class="section-card">
                <span>🏢</span>
                <strong>شرکت</strong>
            </button>

            <button class="section-card">
                <span>🎬</span>
                <strong>فیلم و سریال</strong>
            </button>

            <button class="section-card">
                <span>💡</span>
                <strong>ایده‌ها</strong>
            </button>

            <button class="section-card emoji-library-card">
                <span>🧩</span>
                <strong>Emoji Library</strong>
            </button>

            
<button class="section-card ai-card">
                <span>🤖</span>
                <strong>My AI</strong>
            </button>

            <button class="section-card add-card" type="button" onclick="addSection()">
                <span>＋</span>
                <strong>افزودن بخش</strong>
            </button>

        </section>

    </main>

    <script src="js/app.js?v=1006"></script>

</html>
